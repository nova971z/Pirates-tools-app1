<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pirates Tools • Outillage pro (PWA)</title>
  <meta name="description" content="Pirates Tools — Visseuses à chocs DeWALT, dispo Antilles. PWA rapide, contact immédiat (téléphone & WhatsApp)." />
  <link rel="preload" href="./images/pirates-tools-logo.png?v=7" as="image" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <a class="skip-link" href="#list">Aller au contenu</a>

  <!-- =================== TOPBAR =================== -->
  <header class="topbar" role="banner">
    <div class="topbar-left">
      <button id="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="side-menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>

      <a id="homeLink" class="topbar-logo-link" href="#">
        <img class="topbar-logo" src="./images/pirates-tools-logo.png?v=7" alt="Pirates Tools" />
      </a>
    </div>

    <div class="cta">
      <a id="callBtn" class="btn btn-call" href="tel:+33774230195">📞 <strong>07 74 23 01 95</strong></a>
      <a id="waBtn" class="btn btn-wa" href="https://wa.me/33774230195" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
    </div>
  </header>

  <!-- =================== HERO =================== -->
  <section id="hero" class="hero-full" aria-hidden="true">
    <img id="heroLogo" class="hero-logo" src="./images/pirates-tools-logo.png?v=7" alt="" />
    <div class="hero-fade"></div>
  </section>

  <!-- =================== VUES (SPA) =================== -->
  <main id="app" role="main">

    <!-- HOME -->
    <section id="view-home" class="view">
      <div class="container">
        <h1 tabindex="-1">Bienvenue</h1>
        <p style="margin:0 0 1rem;color:#9fb4c5">Choisissez une marque ou explorez le catalogue.</p>
        <div id="brandGrid" class="brand-grid" role="list"></div>
      </div>
    </section>

    <!-- CATALOGUE -->
    <section id="view-catalogue" class="view hidden">
      <div class="container">
        <h1 tabindex="-1">Catalogue</h1>

        <div class="toolbar">
          <input id="q" class="search" type="search" placeholder="Rechercher (marque, réf, description…)" autocomplete="off" />
          <select id="tag" class="select" aria-label="Filtrer par catégorie">
            <option value="">Tous</option>
          </select>
        </div>

        <div id="catList" class="cat-list" aria-label="Catégories"></div>
        <div id="list" class="list" aria-live="polite" aria-busy="false"></div>
      </div>
    </section>

    <!-- PRODUIT (PDP) -->
    <section id="view-produit" class="view hidden">
      <div class="container pdp">
        <a class="chip chip--back" href="#/catalogue" aria-label="Retour au catalogue">← Retour</a>

        <div class="pdp__grid">
          <div class="pdp__media">
            <img id="pdpImg" alt="" />
          </div>

          <div class="pdp__info">
            <h1 id="pdpTitle" class="pdp__title" tabindex="-1">Produit</h1>
            <div id="pdpTag" class="pdp__tag"></div>
            <p id="pdpDesc" class="pdp__desc"></p>
            <ul id="pdpSpecs" class="pdp__specs"></ul>

            <div class="actions">
              <button id="pdpQuote" class="btn primary" type="button">Ajouter au panier</button>
              <a id="pdpWa" class="btn btn-wa" target="_blank" rel="noopener">WhatsApp</a>
              <button id="pdpShare" class="btn" type="button">Partager</button>
            </div>
          </div>
        </div>

        <div class="pdp__related" id="pdpRelated"></div>
      </div>
    </section>

    <!-- DEVIS (panier) -->
    <section id="view-devis" class="view hidden">
      <div class="container">
        <h1 tabindex="-1">Mon devis</h1>

        <div class="card">
          <div class="head"><h3 class="title">Articles</h3><span class="badge">Panier</span></div>

          <div id="devisList" class="specs" style="display:grid;gap:.8rem"></div>

          <div class="actions">
            <button id="devisSend" class="btn primary" type="button">Envoyer le devis (WhatsApp)</button>
            <button id="devisClear" class="btn" type="button">Vider</button>
          </div>
        </div>
      </div>
    </section>

    <!-- COMPTE -->
    <section id="view-compte" class="view hidden">
      <div class="container">
        <h1 tabindex="-1">Mon compte</h1>

        <div class="card">
          <div class="head"><h3 class="title">Créer / Mettre à jour</h3><span class="badge">Démo</span></div>
          <div class="specs">
            <form id="accountForm" style="display:grid;gap:.6rem;max-width:520px">
              <label>Nom
                <input id="accName" type="text" class="search" placeholder="Votre nom" autocomplete="name" />
              </label>
              <label>Email
                <input id="accEmail" type="email" class="search" placeholder="vous@exemple.com" autocomplete="email" />
              </label>
              <div class="actions">
                <button id="accSave" class="btn primary" type="button">Enregistrer</button>
              </div>
            </form>

            <!-- Jauge fidélité (facultatif / CSS prêt) -->
            <div class="meter" style="max-width:520px;margin-top:1rem">
              <div class="meter__rail">
                <div id="accFill" class="meter__fill"></div>
                <div id="accCursor" class="meter__cursor" style="left:0%"></div>
              </div>
              <div class="meter__scale"><span>0%</span><span>100%</span></div>
              <input id="accSlider" type="range" min="0" max="100" step="1" value="0" />
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- =================== DOCK =================== -->
  <nav id="dock" class="dock" aria-label="Barre d’action">
    <div class="dock__shell">
      <button id="dockQuoteBtn" class="dock__btn dock__btn--tools" type="button" aria-label="Devis WhatsApp">🛠️</button>
      <button id="dockCartBtn"  class="dock__btn dock__btn--cart"  type="button" aria-label="Voir le panier">🛒</button>
      <span id="dockCount" class="dock__badge" aria-label="Articles dans le panier">0</span>
      <a class="dock__btn dock__btn--call" href="tel:+33774230195" aria-label="Appeler">📞</a>
      <a class="dock__btn dock__btn--wa"   href="https://wa.me/33774230195" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
    </div>
  </nav>

  <!-- =================== OVERLAY + MENU LATÉRAL =================== -->
  <div id="menu-overlay" hidden></div>
  <aside id="side-menu" hidden>
    <a class="app-link" href="#/">
      <span class="app-bubble">🏠</span>
      <span class="app-label">Accueil</span>
    </a>
    <a class="app-link" href="#/catalogue">
      <span class="app-bubble">🧰</span>
      <span class="app-label">Catalogue</span>
    </a>
    <a class="app-link" href="#/devis">
      <span class="app-bubble">🛒</span>
      <span class="app-label">Devis</span>
    </a>
    <a class="app-link" href="#/compte">
      <span class="app-bubble">👤</span>
      <span class="app-label">Compte</span>
    </a>
  </aside>

  <!-- =================== TOASTS + A11y roots (les scripts les créent si absents) =================== -->
  <div id="toasts" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <!-- Bouton d’installation PWA (révélé par JS si pertinent) -->
  <button id="installBtn" class="chip hidden" hidden>Installer l’app</button>

  <noscript>
    <div style="padding:1rem;margin:1rem;border:1px solid #22303b;border-radius:8px;background:#121b24;color:#e6edf5">
      Cette application nécessite JavaScript.
    </div>
  </noscript>

  <!-- =================== JS =================== -->
  <script src="./app.js" defer></script>

  <!-- Micro-script menu (non intrusif, compatible avec vos styles) -->
  <script>
    (function(){
      var btn = document.getElementById('menu-toggle');
      var ovl = document.getElementById('menu-overlay');
      var side= document.getElementById('side-menu');
      function open(){ document.body.classList.add('menu-open'); if(ovl) ovl.hidden=false; if(side) side.hidden=false; btn && btn.setAttribute('aria-expanded','true'); }
      function close(){ document.body.classList.remove('menu-open'); if(ovl) ovl.hidden=true;  if(side) side.hidden=true;  btn && btn.setAttribute('aria-expanded','false'); }
      if (btn){ btn.addEventListener('click', function(){ document.body.classList.contains('menu-open') ? close() : open(); }); }
      if (ovl){ ovl.addEventListener('click', close); }
    })();
  </script>
  <script src="./scripts/account.js" defer></script>
</body>
</html>
